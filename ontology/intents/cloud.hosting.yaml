id: cloud.hosting
label: Host files and static websites
description: Upload files, deploy static websites, or ship a web app from a Git repo or build config to a hosted URL via micropayment. Use when an agent needs to publish assets, deploy a site or app, and return a permanent public URL without managing cloud storage or hosting accounts.
aliases:
  - file upload
  - upload file get public URL
  - host a static website
  - deploy static site to CDN
  - host HTML page permanently
  - share file via hosted URL
  - deploy app from GitHub repo
  - trigger a deployment
  - deploy project from build config
  - ship app to hosted URL
consumes:
  - { entity: Document, role: identifier }
produces:
  - { entity: Webpage, role: payload }

facets:
  domain: cloud
  action: provision
