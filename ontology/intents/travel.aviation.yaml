id: travel.aviation
label: Search flights, airports, and aviation data
description: Flight status tracking, airport directory lookups, route search, aviation schedules, aircraft-registry lookups (tail/N-number/ICAO24 → make/model + owner), and nearby-airport search by coordinate. Use when an agent plans travel logistics, tracks flights, or identifies an aircraft — not general POI or restaurant search (maps.places) or hotel review lookup (travel.place_reviews).
aliases:
  - flight tracking API
  - track a flight status
  - airport list lookup
  - search flights by route
  - aviation schedules API
  - flight status by flight number
  - airport filter search
  - flight search by route and date
  - flight departure arrival times
  - airline route lookup
  - aircraft registry lookup
  - tail number lookup
  - N-number registration lookup
  - ICAO24 aircraft lookup
  - nearby airports by coordinate
consumes:
  - entity: Place
    role: identifier
produces:
  - entity: SearchResults
    role: payload
    cardinality: many
facets:
  domain: travel
  action: lookup
links:
  - type: sibling_of
    to: maps.places
    note: aviation is flights and airports; maps.places is local businesses and POIs
  - type: sibling_of
    to: travel.place_reviews
    note: aviation is transport logistics; place_reviews is traveler venue feedback