id: finance.trader_positioning
label: Get trader positioning reports (CFTC Commitments of Traders)
description: CFTC Commitments of Traders (COT) and trader-positioning datasets — commitments-of-traders positioning, sector positioning, and macro positioning context. Use when an agent needs trader-positioning reference data, not actionable trade calls (finance.trading_signals) or a single ticker quote (finance.stock_quote).
aliases:
  - commitments of traders report
  - CFTC commitments of traders
  - market positioning data
  - futures positioning report
  - sector market snapshot
  - institutional positioning data
  - trading positioning statistics
  - cot report lookup
consumes:
  - entity: Query
    role: identifier
produces:
  - entity: EconomicIndicator
    role: payload
    cardinality: many
facets:
  domain: finance
  action: lookup
  modality:
    - timeseries
links:
  - type: sibling_of
    to: finance.trading_signals
    note: trader_positioning is raw positioning reference data; trading_signals are actionable calls
  - type: sibling_of
    to: finance.stock_quote
    note: trader_positioning is cross-market positioning reference; stock_quote is a single equity price
  - type: sibling_of
    to: finance.economic_data
    note: adjacent macro datasets; economic_data is government indicators, trader_positioning is trader positioning