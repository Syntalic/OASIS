id: media.transcode
label: Transcode audio and extract media frames
description: Convert audio between formats and extract media from A/V files — MP4 to MP3, extract the audio track, grab a video frame or thumbnail, change audio format, or remux a container. Use when an agent reformats or processes audio or pulls a still frame, not transcription to text (ai.speech_to_text).
aliases:
  - convert mp4 to mp3
  - extract audio from video
  - convert audio format
  - grab a video thumbnail
  - extract a video frame
  - change audio format
  - remux a media file
consumes:
  - entity: AudioClip
    role: identifier
produces:
  - entity: AudioClip
    role: payload
  - entity: Image
    role: payload
facets:
  domain: media
  action: transform
  modality:
    - audio
    - image
links:
  - type: sibling_of
    to: ai.speech_to_text
    note: transcode reformats audio or extracts a still frame; speech_to_text transcribes audio into text — not substitutable
