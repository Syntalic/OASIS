id: science.agriculture_stats
label: Look up agricultural statistics
description: Agricultural statistics — crop production, yields, prices, and county or state-level farm data from official sources (USDA/NASS in the US; FAOSTAT and Eurostat internationally). Use when an agent needs authoritative agriculture figures, not general civic address data (gov.civic).
aliases:
  - USDA NASS QuickStats lookup
  - crop yield data by county
  - farm commodity statistics API
  - agriculture census data lookup
  - NASS agricultural stats API
  - crop production statistics
  - agricultural commodity statistics
consumes:
  - entity: Query
    role: identifier
produces:
  - entity: Answer
    role: payload
    cardinality: many
facets:
  domain: science
  action: lookup
links:
  - type: sibling_of
    to: gov.civic
    note: agriculture_stats is USDA farm commodity data; gov_civic is legislative and civic address enrichment